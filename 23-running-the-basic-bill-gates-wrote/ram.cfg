# Chapter 20: the memory for a program that the Mac sends, described for the
# linker ld65, as in chapter 19. memory.cfg, from chapter 7, makes the 16,384
# bytes of the ROM; this one makes a program for the RAM. It begins at $0300,
# and the file holds only its own bytes, from the first to the last:
# tools/send.py sends them, and the monitor stores them where they belong.
#
#   $0000-$00FF   RAM: the zero page. The monitor keeps $00 to $07, the console
#                 $F0 to $FA; the program may use what is left
#   $0100-$01FF   RAM: the stack
#   $0200-$02FF   RAM: the monitor's line, from $0200 to $027F; the rest free
#   $0300-$7FFF   RAM: the program, and what it needs to remember

MEMORY {
    ZP:   start = $0000, size = $0100, type = rw, file = "";
    RAM:  start = $0300, size = $7D00, type = rw, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  optional = yes;
    CODE:     load = RAM, type = rw;
    RODATA:   load = RAM, type = ro,  optional = yes;
    BSS:      load = RAM, type = bss, optional = yes;
}
