# Chapter 23: where Microsoft's BASIC goes, described for the linker ld65. It
# is built apart from the monitor and starts at $D000; tools/rom.py then lays
# its bytes into the ROM. The segments are those of mist64/msbasic, in its
# order. Its page zero is set in basic.s.
#
#   $D000-$FFF9   ROM: the BASIC, and our routines at its end
#   $FFFA-$FFFF   ROM: the vectors, which are the monitor's

MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, file = "";
    ROM:    start = $D000, size = $2FFA, type = ro, file = %O;
    DUMMY:  start = $0000, size = $0100, file = "";
}

SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    HEADER:   load = ROM,   type = ro;
    VECTORS:  load = ROM,   type = ro;      # the BASIC's own table of statements
    KEYWORDS: load = ROM,   type = ro;
    ERROR:    load = ROM,   type = ro;
    CODE:     load = ROM,   type = ro;
    CHRGET:   load = ROM,   type = ro;
    INIT:     load = ROM,   type = ro;
    EXTRA:    load = ROM,   type = ro;
    DUMMY:    load = DUMMY;                 # only counts the keywords: no bytes
}
