name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: davidsiaw/yosys-docker:latest

    steps:
      - name: Install cc65
        run: apt install cc65

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: make -j$(nproc) test
