name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # TODO(siggi): Can this use the Dockerfile in .devcontainer?
      image: davidsiaw/yosys-docker:latest

    steps:
      - name: Install cc65
        run: |
          apt install cc65

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check nproc
        run: echo -j$(nproc)
