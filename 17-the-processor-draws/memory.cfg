# The memory of our computer, described for the linker ld65.
# Written once, in chapter 7: every program of the book is linked with it.
#
#   $0000-$00FF   RAM: the zero page
#   $0100-$01FF   RAM: the stack
#   $0200-$7FFF   RAM: free for what a program needs to remember
#   $8000-$BFFF   not memory: the six LEDs are at $8000, the rest is kept for later
#   $C000-$FFFF   ROM: 16,384 bytes, the only part that goes into the file

MEMORY {
    ZP:   start = $0000, size = $0100, type = rw, file = "";
    RAM:  start = $0200, size = $7E00, type = rw, file = "";
    ROM:  start = $C000, size = $4000, type = ro, file = %O, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  optional = yes;
    BSS:      load = RAM, type = bss, optional = yes;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro,  optional = yes;
    VECTORS:  load = ROM, type = ro,  optional = yes, start = $FFFA;
}
